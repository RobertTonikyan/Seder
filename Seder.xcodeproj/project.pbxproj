name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "30 3 * * 1"   # every Monday 03:30 UTC
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Make project readable by the runner's Xcode
        # Project was saved by Xcode 27 (format 110); the runner has Xcode 26.
        # This only changes the copy on the CI machine, not the repo.
        run: |
          sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' Seder.xcodeproj/project.pbxproj
          grep objectVersion Seder.xcodeproj/project.pbxproj

      - name: Build
        run: |
          xcodebuild -version
          xcodebuild -list -project Seder.xcodeproj
          xcodebuild build \
            -project Seder.xcodeproj \
            -scheme Seder \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
